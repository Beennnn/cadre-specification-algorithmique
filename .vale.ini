# Vale — le contrôle du vocabulaire, côté marché. Voir OUTILLAGE.md
#
#   pip install vale && vale sync   # ou : brew install vale
#   vale exemples/
#
# Portée volontairement étroite : les documents de MÉTHODE parlent des
# formulations qu'ils interdisent — REGLES-DE-CONTROLE.md énumère « etc. », « le
# cas échéant », « en général ». Passer Vale dessus produirait des échecs sur des
# phrases parfaitement correctes. On ne vise donc que les SPÉCIFICATIONS.
#
# Dans le dépôt d'un produit, remplacer ces sections par le chemin réel des
# spécifications — le plus souvent une seule ligne : [specs/**/*.md]

StylesPath = styles
MinAlertLevel = error

[exemples/*/spec/*.md]
BasedOnStyles = Methode

[exemples/fil-rouge/5-SPEC-*.md]
BasedOnStyles = Methode
